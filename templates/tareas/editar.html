{% extends "base.html" %}

{% block title %}Editar Tarea — NeuroFocus{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2>Editar Tarea</h2>
        <a href="{{ url_for('tasks.index') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            ← Cancelar
        </a>
    </div>

    <div class="card">
        <form method="POST" action="{{ url_for('tasks.editar', id_tarea=tarea.id_tarea) }}">
            <div class="form-group">
                <label for="nombre">Título / Nombre de la tarea *</label>
                <input type="text" id="nombre" name="nombre" value="{{ tarea.nombre }}" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion" value="{{ tarea.descripcion or '' }}">
            </div>

            <div class="form-group">
                <label for="fecha_entrega">Fecha de entrega / límite</label>
                <input type="date" id="fecha_entrega" name="fecha_entrega" value="{{ tarea.fecha_entrega }}">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad" name="prioridad" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
                        {% for p in prioridades %}
                            <option value="{{ p }}" {% if tarea.prioridad == p %}selected{% endif %}>
                                {{ p|capitalize }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
                        {% for e in estados %}
                            <option value="{{ e }}" {% if tarea.estado == e %}selected{% endif %}>
                                {{ e|replace('_', ' ')|capitalize }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn-primary" style="flex: 1;">
                    Guardar Cambios
                </button>
                <a href="{{ url_for('tasks.index') }}" style="display: inline-block; padding: 0.75rem 1.25rem; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; color: var(--text-muted); font-weight: 500; text-align: center;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
