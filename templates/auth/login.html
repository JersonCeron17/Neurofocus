{% extends "base.html" %}

{% block title %}Iniciar Sesión — NeuroFocus{% endblock %}

{% block content %}
<div class="container-narrow">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Iniciar Sesión</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
            Bienvenido/a a tu espacio de concentración y organización académica.
        </p>

        <form action="{{ url_for('auth.login') }}" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" value="{{ correo or '' }}" placeholder="estudiante@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-primary">Entrar a NeuroFocus</button>
        </form>

        <div class="auth-footer">
            ¿Aún no tienes una cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate gratis</a>
        </div>
    </div>
</div>
{% endblock %}
